services:
  source-mysql:
    image: mysql:8.4
    container_name: shadowbase-source-mysql
    command: ["--server-id=101", "--log-bin=mysql-bin", "--binlog_format=ROW", "--binlog_row_image=FULL", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: localRoot123!
      MYSQL_DATABASE: shadowbase_source
      MYSQL_USER: shadowbase
      MYSQL_PASSWORD: shadowbase123
    ports:
      - "3307:3306"
    volumes:
      - source_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocalRoot123!"]
      interval: 10s
      timeout: 5s
      retries: 20
  shadow-mysql:
    image: mysql:8.4
    container_name: shadowbase-shadow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: localRoot123!
      MYSQL_DATABASE: shadowbase_shadow
      MYSQL_USER: shadowbase
      MYSQL_PASSWORD: shadowbase123
    ports:
      - "3308:3306"
    volumes:
      - shadow_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocalRoot123!"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.7.0
    container_name: shadowbase-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  connect:
    image: debezium/connect:2.7.3.Final
    container_name: shadowbase-debezium-connect
    depends_on:
      source-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: shadowbase_connect_configs
      OFFSET_STORAGE_TOPIC: shadowbase_connect_offsets
      STATUS_STORAGE_TOPIC: shadowbase_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      REST_ADVERTISED_HOST_NAME: connect
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
volumes:
  source_data:
  shadow_data:
